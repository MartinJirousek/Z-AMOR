.logo-area {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 42px;

    margin-top: 42px;
    padding: 10px 0 0;
}

.logo-area img {
    display: block;

    height: 150px;
    width: auto;
    max-width: 42%;

    object-fit: contain;

    filter:
        drop-shadow(0 12px 18px rgba(20, 65, 40, 0.16));
}
